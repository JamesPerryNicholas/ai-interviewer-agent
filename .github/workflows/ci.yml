name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - working-directory: backend
        run: uv sync --group dev --frozen
      - working-directory: backend
        run: uv run ruff check app tests
      - working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      POSTGRES_PASSWORD: TemporaryCiDatabasePassword2026
      REDIS_PASSWORD: TemporaryCiRedisPassword2026
      JWT_SECRET_KEY: TemporaryCiJwtSecretWithAtLeastThirtyTwoCharacters2026
      ADMIN_PASSWORD: TemporaryCiAdminPassword2026
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
